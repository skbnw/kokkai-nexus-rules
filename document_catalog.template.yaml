# document_catalog.yaml
# 全データのメタデータを一元定義する中央資料目録（COMMON_RULES.md §8-3）。
# 実運用ではこのテンプレートをコピーし、各エントリを追加していく。

# --- 記入例（白書・§5-6） ---
- document_id: "WP-BOUEI-2025"
  document_kind: "white_paper"
  title: "防衛白書 令和7年版"
  publisher: "防衛省"
  fiscal_year: 2025
  theme_id: "TH-DEFENSE-001"
  trust_layer: "L1"
  trust_score: 5
  is_official_narrative_sections: true   # §5-6-a: 統計と政策的記述が混在する旨のフラグ
  extraction_method: "native_text"       # ocr | native_text（§5-6-c）
  storage_tier: "hot"                    # hot(頻繁に参照) | cold(アーカイブ)
  bronze_path: "gs://polidata-master-bucket/raw/whitepapers/bouei/2025/"
  supersedes: null

